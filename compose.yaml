# Node läuft nur im Container, auf dem Mac muss nichts installiert werden.
services:
  dev:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

volumes:
  node_modules:
